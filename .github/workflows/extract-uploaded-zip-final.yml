name: Extract uploaded project ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/extract-uploaded-zip.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract uploaded ZIP
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=( *.zip )
          if [ ${#archives[@]} -eq 0 ]; then
            echo "No ZIP archive found at the repository root."
            exit 1
          fi
          for archive in "${archives[@]}"; do
            echo "Extracting $archive"
            unzip -o "$archive" -d .
            rm "$archive"
          done

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # The default GITHUB_TOKEN cannot push workflow-file changes.
          # Keep the Android build workflow for a separate manual upload.
          git reset -q -- .github/workflows/build-android-apk.yml || true
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
          else
            git commit -m "Extract uploaded project ZIP"
            git push
          fi
