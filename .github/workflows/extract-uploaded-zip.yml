name: Extract uploaded project ZIP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.zip"

permissions:
  contents: write

concurrency:
  group: extract-zip
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract ZIP into repository
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=( *.zip )
          if [ ${#archives[@]} -eq 0 ]; then
            echo "No ZIP at repository root. Nothing to do."
            exit 0
          fi
          for archive in "${archives[@]}"; do
            echo "Extracting $archive"
            unzip -o "$archive" -d .
            rm -f "$archive"
          done

      - name: Commit extracted files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          # GITHUB_TOKEN cannot push workflow files, so drop them entirely
          git reset -q -- .github/workflows || true
          git checkout -- .github/workflows 2>/dev/null || true
          git clean -fdq -- .github/workflows || true

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Extract uploaded project ZIP"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
