name: Flutter foundation checks

on:
  push:
    branches:
      - feature/flutter-cross-platform-foundation
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-mobile.yml'

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve packages
        run: flutter pub get
      - name: Format Dart sources
        run: dart format lib test
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Run tests
        run: flutter test --no-pub
