name: Android Flutter Add-to-App compatibility

on:
  push:
    branches:
      - feature/flutter-cross-platform-foundation
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'mobile/**'
      - '.github/workflows/android-flutter-add-to-app.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'mobile/**'
      - '.github/workflows/android-flutter-add-to-app.yml'

permissions:
  contents: read

concurrency:
  group: android-flutter-add-to-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-integration-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate temporary Flutter module
        shell: bash
        run: |
          flutter --version
          flutter create --template=module --org com.dominion.askscreenai ci_flutter_module
          rm -rf ci_flutter_module/lib
          cp -R mobile/lib ci_flutter_module/lib
          cat > ci_flutter_module/pubspec.yaml <<'EOF'
          name: dom_askscreen_ai_module
          description: CI-generated Flutter module for DOM AskScreen AI host integration.
          publish_to: "none"
          version: 1.1.4+7

          environment:
            sdk: ">=3.12.0 <4.0.0"
            flutter: ">=3.44.0"

          dependencies:
            flutter:
              sdk: flutter
            firebase_core: ^5.2.0
            firebase_auth: ^7.1.0
            shared_preferences: ^2.5.3

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^4.0.0

          flutter:
            uses-material-design: true
            module:
              androidX: true
              androidPackage: com.dominion.askscreenai.fluttermodule
              iosBundleIdentifier: com.dominion.askscreenaiFlutterModule
          EOF
          cd ci_flutter_module
          flutter pub get

      - name: Wire temporary module into existing host build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("settings.gradle.kts")
          text = settings.read_text()
          # Align the host's temporary CI Kotlin plugin version with the Firebase SDK metadata.
          catalog = Path("gradle/libs.versions.toml")
          catalog_text = catalog.read_text()
          catalog_text = catalog_text.replace('kotlin = "2.2.10"', 'kotlin = "2.4.0"')
          catalog.write_text(catalog_text)

          marker = "repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)"
          if marker not in text:
              raise SystemExit("Expected repository mode declaration was not found.")
          text = text.replace(
              marker,
              "repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)",
              1,
          )
          marker = "dependencyResolutionManagement {"
          if marker not in text:
              raise SystemExit("Dependency resolution management block was not found.")
          start = text.index(marker)
          repo_marker = "    google()\n    mavenCentral()"
          repo_index = text.find(repo_marker, start)
          if repo_index < 0:
              raise SystemExit("Expected dependency repositories were not found.")
          text = text[:repo_index] + text[repo_index:].replace(
              repo_marker,
              "    google()\n    mavenCentral()\n    maven(\"https://storage.googleapis.com/download.flutter.io\")",
              1,
          )
          if 'ci_flutter_module/.android/include_flutter.groovy' not in text:
              text += (
                  '\n// CI-only Flutter Add-to-App integration; generated module is not committed.\n'
                  'val flutterModuleGradle = rootDir.resolve("ci_flutter_module/.android/include_flutter.groovy")\n'
                  'apply(from = flutterModuleGradle)\n'
              )
          settings.write_text(text)

          # Kotlin DSL plugin scripts in Flutter add-to-app plugin projects need
          # the Flutter Gradle plugin on the host buildscript classpath so the
          # flutter.compileSdkVersion accessor is visible at script compile time.
          root_build = Path("build.gradle.kts")
          root_text = root_build.read_text()
          flutter_plugin_declaration = '  id("dev.flutter.flutter-gradle-plugin") version "1.0.0" apply false'
          if "dev.flutter.flutter-gradle-plugin" not in root_text:
              marker = "plugins {"
              if marker not in root_text:
                  raise SystemExit("Root Gradle plugins block was not found.")
              root_text = root_text.replace(marker, marker + "\\n" + flutter_plugin_declaration, 1)
          root_build.write_text(root_text)

          app = Path("app/build.gradle.kts")
          text = app.read_text()
          text = text.replace(
              "sourceCompatibility = JavaVersion.VERSION_11",
              "sourceCompatibility = JavaVersion.VERSION_17",
          ).replace(
              "targetCompatibility = JavaVersion.VERSION_11",
              "targetCompatibility = JavaVersion.VERSION_17",
          )
          if "implementation(project(\" :flutter\"))" in text:
              raise SystemExit("Unexpected malformed Flutter dependency already present.")
          if 'implementation(project(":flutter"))' not in text:
              marker = "dependencies {"
              if marker not in text:
                  raise SystemExit("App dependencies block was not found.")
              text = text.replace(
                  marker,
                  marker + '\n  implementation(project(":flutter"))',
                  1,
              )
          app.write_text(text)
          PY

      - name: Create CI-only debug signing keystore
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build existing Android host with Flutter module
        run: gradle :app:assembleDebug --no-daemon --no-configuration-cache --stacktrace
