<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;background:#0002;cursor:crosshair;overflow:hidden}#rect{position:absolute;border:2px solid #38e5d2;background:#38e5d222;display:none}#tip{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 16px;background:#121a2cee;color:white;border-radius:9px;font:14px Segoe UI}</style></head><body><div id="tip">Drag to select an area • Esc to cancel • Enter to read</div><div id="rect"></div><script>let s=null,r=document.getElementById('rect');document.addEventListener('pointerdown',e=>{s={x:e.clientX,y:e.clientY};r.style.display='block';Object.assign(r.style,{left:s.x+'px',top:s.y+'px',width:'0px',height:'0px'});});document.addEventListener('pointermove',e=>{if(!s)return;let x=Math.min(s.x,e.clientX),y=Math.min(s.y,e.clientY);Object.assign(r.style,{left:x+'px',top:y+'px',width:Math.abs(e.clientX-s.x)+'px',height:Math.abs(e.clientY-s.y)+'px'});});function done(){if(!s)return;let q=r.getBoundingClientRect();dominion.regionSelected({x:q.x,y:q.y,width:q.width,height:q.height});s=null;}document.addEventListener('pointerup',done);document.addEventListener('keydown',e=>{if(e.key==='Escape')dominion.regionSelected(null);if(e.key==='Enter')done();});</script></body></html>
