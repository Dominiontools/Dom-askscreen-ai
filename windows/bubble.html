<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:250px;height:430px;background:transparent;overflow:hidden;font:14px Segoe UI;color:white}#bubble{-webkit-app-region:no-drag;position:absolute;left:0;top:0;width:62px;height:62px;margin:7px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,#805cff,#13b9aa);border:3px solid #eafaff;box-shadow:0 0 8px #20e5dc,0 0 22px #655cff;cursor:move;font-size:27px;font-weight:800;user-select:none}#menu{-webkit-app-region:no-drag;display:none;position:absolute;left:0;top:78px;width:230px;padding:9px;border-radius:15px;background:#171e30ed;border:1px solid #657391;box-shadow:0 8px 30px #000b}button{display:block;width:100%;text-align:left;margin:4px 0;padding:9px;border:0;border-radius:8px;background:#2b3650;color:white;cursor:pointer}button:hover{background:#46577b}.led{display:inline-block;width:8px;height:8px;border-radius:50%;background:#37e69a;box-shadow:0 0 8px #37e69a;margin-right:7px}</style></head><body><div id="bubble" title="Drag • click for actions">D</div><div id="menu"><div><i class="led"></i>DOMINION ASK AI</div><button data-a="read">▣ Start continuous screen reading</button><button data-a="stop-read">■ Stop screen reading</button><button data-a="region">⌖ Select screen region</button><button data-a="listen">🎙 Listen to questions</button><button data-a="transcribe">≋ Transcribe audio</button><button data-a="readlisten">◉ Read screen + listen</button><button data-a="answer">▣ Show floating answer</button><button data-a="open">↩ Return to assistant</button><button data-a="hide">Hide bubble</button></div><script>const b=document.getElementById('bubble'),m=document.getElementById('menu');let start=null,moved=false;b.addEventListener('pointerdown',e=>{start={x:e.screenX,y:e.screenY};moved=false;b.setPointerCapture(e.pointerId);});b.addEventListener('pointermove',e=>{if(start&&(e.buttons===1)){const dx=e.screenX-start.x,dy=e.screenY-start.y;if(Math.abs(dx)+Math.abs(dy)>2){moved=true;window.dominion.moveBubble(dx,dy);start={x:e.screenX,y:e.screenY};}}});b.addEventListener('pointerup',()=>{if(!moved)m.style.display=m.style.display==='block'?'none':'block';start=null;});m.addEventListener('click',e=>{const a=e.target.dataset.a;if(a){window.dominion.action(a);m.style.display='none';}});</script></body></html>
