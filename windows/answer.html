<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:rgba(17,24,39,.58);color:#f8faff;font:15px Segoe UI;border:1px solid rgba(190,205,235,.55);border-radius:14px;overflow:hidden;backdrop-filter:blur(5px)}header{padding:10px;background:rgba(34,45,67,.48);display:flex;justify-content:space-between;cursor:move;-webkit-app-region:drag;text-shadow:0 1px 3px #000}header button{-webkit-app-region:no-drag}button{background:#35415b;color:white;border:0;border-radius:7px;padding:5px 10px}#answer{padding:16px;white-space:pre-wrap;overflow:auto;max-height:280px;background:rgba(10,15,25,.18);text-shadow:0 1px 3px rgba(0,0,0,.9);line-height:1.5}.led{color:#41edaa;text-shadow:0 0 8px #41edaa}</style></head><body><header><b><span class="led">●</span> Dominion AI Answer</b><button onclick="dominion.closeAnswer()">×</button></header><div id="answer">Waiting for an answer…</div><script>dominion.onAnswerText(t=>document.getElementById('answer').textContent=t)</script></body></html>
