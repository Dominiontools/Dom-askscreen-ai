<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dominion Ask AI</title><link rel="stylesheet" href="styles.css"></head>
<body><header><div class="brand"><div class="logo">D</div><div><b>Dominion Ask AI</b><small>Desktop assistant</small></div></div><div class="window-actions"><button id="settingsQuick" title="Open settings">⚙ Settings</button><button id="invisibleQuick" title="Toggle Invisible Presentation Mode">Invisible: OFF</button><button id="pin" title="Always on top">◆</button><button id="min">—</button><button id="close">×</button></div></header>
<main><div class="status"><span id="dot"></span><span id="statusText">Ready</span><span class="hint">Ctrl + Shift + Space to show/hide</span></div>
<section id="chat" class="chat"><div class="welcome"><div class="biglogo">D</div><h2>How can I help?</h2><p>Ask by typing, speaking, or sharing your screen.</p></div></section>
<div id="transcript" class="transcript" hidden></div>
<div class="toolbar"><button id="screenBtn">▣ <span>Ask about screen</span></button><button id="micBtn">🎙 <span>Speak</span></button><button id="transcribeBtn">≋ <span>Transcribe only</span></button><button id="systemAudioBtn">♫ <span>Listen to PC audio</span></button><select id="audioInput" title="Microphone / external audio input"><option value="">Loading audio devices…</option></select><button id="externalAudioBtn">🎧 <span>Use external audio</span></button><select id="language" title="Speech language"><option value="en-NG">English (Nigeria)</option><option value="yo-NG">Yoruba (Nigeria)</option><option value="en-US">English (US)</option></select></div>
<form id="askForm"><textarea id="prompt" rows="2" placeholder="Type your question..." required></textarea><button class="send" type="submit">Send ↑</button></form>
<div class="settings"><label class="bubble-toggle"><input id="enableBubble" type="checkbox"> Enable one floating bubble</label><label class="bubble-toggle"><input id="invisibleMode" type="checkbox"> Invisible Presentation Mode <small>(Ctrl + Shift + I)</small></label><label>Backend URL <input id="endpoint" type="url" placeholder="https://your-site.netlify.app/.netlify/functions/ask-screen"></label><button id="save">Save</button></div>
<footer>Microphone and screen capture require your permission. Listening uses your PC microphone.</footer></main><script src="renderer.js"></script></body></html>
